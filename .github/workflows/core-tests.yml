name: Android diagnostic build and core tests
on:
  push:
    branches: [main, "feat/**", "feature/**"]
  pull_request:
    branches: [main]
concurrency:
  group: android-game-mode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Run core tests and build diagnostic APK
        run: gradle --no-daemon :core:test :app:assembleDebug :service:assembleDebug
      - name: Run Android runtime integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # ATD images are trimmed for automated tests and boot faster than full Google APIs images.
          # API 33 is sufficient for the runtime test and supports the receiver flags API used by the test.
          api-level: 33
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon :runtime:connectedDebugAndroidTest
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: android-game-mode-diagnostic-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build Magisk module
        run: magisk/build-module.sh service/build/outputs/apk/debug/service-debug.apk gamemode-service-magisk.zip
      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: android-game-mode-magisk-module
          path: gamemode-service-magisk.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload service APK
        uses: actions/upload-artifact@v4
        with:
          name: android-game-mode-service-debug
          path: |
            service/build/outputs/apk/debug/service-debug.apk
            service/rom/privapp-permissions-com.izzyn0okami.gamemode.service.xml
          if-no-files-found: error
          retention-days: 14
